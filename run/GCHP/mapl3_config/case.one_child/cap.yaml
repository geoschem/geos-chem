cap:
  name: cap
  restart: cap_restart.yaml

  clock:
    dt: PT10M
    start: 2004-01-20T00:00:00
    stop: 2999-03-02T21:00:00
    segment_duration: PT1H

  root_name: GCHP

  extdata_name: EXTDATA
  run_extdata: true

  history_name: HIST
  run_history: false

  checkpointing:
    enabled: false
    final: false
    path: checkpoints
    alarms: {}

  mapl:
    children:
      GCHP:
        dso: libGCHP_GridComp
        config_file: gchp.yaml
        setservices: gchp_setservices_
      EXTDATA:
        dso: libMAPL.extdata.dylib
        config_file: extdata.yaml
      HIST:
        dso: libMAPL.history.dylib
        config_file: history.yaml

esmf:
  logKindFlag: ESMF_LOGKIND_MULTI
  defaultCalKind: ESMF_CALKIND_GREGORIAN
  logAppendFlag: false
  loglevel: ESMF_LOGLEVEL_DEBUG

mapl:
  model_petcount: 6
  pflogger_cfg_file: logging.yaml
