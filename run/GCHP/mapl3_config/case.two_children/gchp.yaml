RUN_DT: 600

mapl:

  geometry:
    kind: from_child
    provider: AdvCore

  children:
    GCHPctmEnv:
      dso: libGCHPctmEnv_GridComp
      config_file: gchpctmenv.yaml
      setservice: gchpctmenv_setservices_
    AdvCore:
      dso: libFVdycoreCubed_GridComp
      config_file: advcore.yaml
      setservice: advcore_setservices_

  connections:
    - src_name: PLE0
      src_comp: GCHPctmEnv
      dst_name: PLE0
      dst_comp: AdvCore

    - src_name: PLE1
      src_comp: GCHPctmEnv
      dst_name: PLE1
      dst_comp: AdvCore

    - src_name: MFX
      src_comp: GCHPctmEnv
      dst_name: MFX
      dst_comp: AdvCore

    - src_name: MFY
      src_comp: GCHPctmEnv
      dst_name: MFY
      dst_comp: AdvCore

    - src_name: CX
      src_comp: GCHPctmEnv
      dst_name: CX
      dst_comp: AdvCore

    - src_name: CY
      src_comp: GCHPctmEnv
      dst_name: CY
      dst_comp: AdvCore

