active_collections:
  - GCHPctmEnv

time_specs:
  tavg_10m: &tavg_10m
    frequency: PT10M
    mode: average

  tavg_1hr: &tavg_1hr
    frequency: PT1H
    mode: average

  tavg_1day: &tavg_1day
    frequency: P1D
    mode: average

  tavg_1mon: &tavg_1mon
    frequency: P1M
    mode: average

  inst_dt: &inst_dt
    mode: instantaneous

  inst_10m: &inst_10m
    frequency: PT10M
    mode: instantaneous

  inst_1hr: &inst_1hr
    frequency: PT1H
    mode: instantaneous

  inst_1day: &inst_1day
    frequency: P1D
    mode: instantaneous

  inst_1mon: &inst_1mon
    frequency: P1M
    mode: instantaneous

collections:
  GCHPctmEnv:
    template: "OutputDir/%c.%y4%m2%d2_%h2%n2z.nc4"
    time_spec: *inst_dt
    var_list:
      SPHU0:           {source: GCHPctmEnv.SPHU0}
      SPHU1:           {source: GCHPctmEnv.SPHU1}
      PLE0:            {source: GCHPctmEnv.PLE0}
      PLE1:            {source: GCHPctmEnv.PLE1}
      DryPLE0:         {source: GCHPctmEnv.DryPLE0}
      DryPLE1:         {source: GCHPctmEnv.DryPLE1}
      MFX:             {source: GCHPctmEnv.MFX}
      MFY:             {source: GCHPctmEnv.MFY}
      CX:              {source: GCHPctmEnv.CX}
      CY:              {source: GCHPctmEnv.CY}
      UpwardsMassFlux: {source: GCHPctmEnv.UpwardsMassFlux}

geoms:
  PE24x144-CF:
    class: CubedSphere
    im_world: 24
  PC360x181-DC:
    class: latlon
    im_world: 360
    jm_world: 181
    pole: PC
    dateline: DC
  REGIONAL1x1:
    class: latlon
    im_world: 80
    jm_world: 40
    lon_range: [0.0, 80.0]
    lat_range: [-30.0, 10.0]

